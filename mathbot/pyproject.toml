[project]
name = "mathbot"
version = "0.1.0"
description = "Tutor de matemáticas socrático basado en IA local (Ollama) con interfaz Gradio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.11.0",
    "langchain>=0.2.0",
    "langchain-ollama>=0.1.0",
    "ollama>=0.6.1",
    "pillow>=10.0.0",
]

[tool.uv]
# MathBot es una aplicación (scripts), no una librería instalable.
package = false
