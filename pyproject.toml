[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "math_edu_chatbot"
version = "0.0.1"
description = "The Classroom Cloud (Local Client-Server)"
authors = [
  { name = "Hernan Benitez" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["math_edu_chatbot"]
include = ["pyproject.toml", "math_edu_chatbot/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["math_edu_chatbot"]
force-sort-within-sections = true

